name: CI

# The helm apps are folders run by the stock bro binary, so testing them means
# building bro (the desktop profile without 3D/physics: no vcpkg; <terminal>
# and the desktop libraries are on) and running each app's headless tests
# against its bro-headless on Lavapipe, the software Vulkan device.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: helmapps

      - uses: actions/checkout@v7
        with:
          repository: wlejon/bro
          path: bro

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm libvulkan-dev mesa-vulkan-drivers \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev \
            libfreetype-dev libfontconfig1-dev libpng-dev libjpeg-dev libwebp-dev \
            libsystemd-dev libseat-dev libxcb-randr0-dev libxau-dev libinput-dev \
            libdrm-dev libgbm-dev \
            bash zsh fish
          sudo chmod -R g-w,o-w /usr/local/share/zsh /usr/share/zsh 2>/dev/null || true

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build bro
        working-directory: bro
        run: |
          python3 -c 'p="src/bronze_host/host_media.cpp"; s=open(p).read(); s=s.replace("#if BRO_WITH_VIDEO\n#include \"video/media_analysis.h\"\n#include <cctype>\n#include <cmath>\n#include <string>\n#include <vector>\n#if BRO_WITH_AUDIO\n#include \"broaudio/io/audio_tags.h\"\n#endif\n#endif\n\nnamespace bro::bronze_host {\n\n#if BRO_WITH_VIDEO", "#include <cctype>\n#include <cmath>\n#include <string>\n#include <vector>\n#if BRO_WITH_VIDEO\n#include \"video/media_analysis.h\"\n#endif\n#if BRO_WITH_AUDIO\n#include \"broaudio/io/audio_tags.h\"\n#endif\n\nnamespace bro::bronze_host {\n\n#if BRO_WITH_VIDEO || BRO_WITH_AUDIO").replace("static int intOption(", "#if BRO_WITH_VIDEO\nstatic int intOption(").replace("#if BRO_WITH_AUDIO\n#ifndef BROAUDIO_HAS_AAC", "#endif // BRO_WITH_VIDEO\n#if BRO_WITH_AUDIO\n#ifndef BROAUDIO_HAS_AAC").replace("    media.def(\"peaks\", 2, js_media_peaks);\n    media.def(\"thumbnails\", 2, js_media_thumbnails);", "#if BRO_WITH_VIDEO\n    media.def(\"peaks\", 2, js_media_peaks);\n    media.def(\"thumbnails\", 2, js_media_thumbnails);\n#endif"); open(p, "w").write(s); r="src/bronze_host/host_bro_root.cpp"; rs=open(r).read().replace("#if !BRO_WITH_VIDEO\n    setUnavailable(\"media\", \"BRO_WITH_VIDEO\");\n#endif", "#if !BRO_WITH_VIDEO && !BRO_WITH_AUDIO\n    setUnavailable(\"media\", \"BRO_WITH_VIDEO\");\n#endif"); open(r, "w").write(rs)'
          cmake -B build -G Ninja \
            -DBRO_PROFILE=desktop \
            -DBRO_WITH_3D=OFF \
            -DBRO_WITH_PHYSICS=OFF \
            -DBRO_WITH_GAMEAI=OFF \
            -DBRO_WITH_FLORA=OFF \
            -DBRO_WITH_VISION=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build --parallel 4 --target bro-headless bro_pty_child

      - name: Tests
        env:
          BRO_HEADLESS: ${{ github.workspace }}/bro/build/bro-headless
        run: helmapps/scripts/run_tests.sh
