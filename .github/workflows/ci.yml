name: CI

# The helm apps are folders run by the stock bro binary, so testing them means
# building bro (the desktop profile without 3D/physics: no vcpkg; <terminal>
# and the desktop libraries are on) and running each app's headless tests
# against its bro-headless on Lavapipe, the software Vulkan device.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IDLE_TIMEOUT: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: helmapps

      - uses: actions/checkout@v7
        with:
          repository: wlejon/bro
          path: bro

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build nasm libvulkan-dev mesa-vulkan-drivers \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libopus-dev libudev-dev \
            libfreetype-dev libfontconfig1-dev libpng-dev libjpeg-dev libwebp-dev \
            libsystemd-dev libseat-dev libxcb-randr0-dev libxau-dev libinput-dev \
            libdrm-dev libgbm-dev \
            bash zsh fish
          sudo chmod -R g-w,o-w /usr/local/share/zsh /usr/share/zsh 2>/dev/null || true

      - name: Seed sccache tool cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARCH="x64"; ASSET="sccache-v0.19.0-x86_64-unknown-linux-musl.tar.gz"
          DEST="$RUNNER_TOOL_CACHE/sccache/0.19.0/$ARCH"
          mkdir -p "$DEST"
          if (cd "$DEST" && gh release download v0.19.0 -R mozilla/sccache -p "$ASSET" -O "$ASSET" && tar -xzf "$ASSET" --strip-components=1 && rm -f "$ASSET"); then
            touch "${DEST}.complete"
          fi

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.19.0"

      - name: Build bro
        working-directory: bro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > opus.cmake << 'EOF'
          if(NOT TARGET Opus::opus)
            find_package(PkgConfig QUIET)
            if(PkgConfig_FOUND)
              pkg_check_modules(SYS_OPUS QUIET IMPORTED_TARGET opus)
              if(TARGET PkgConfig::SYS_OPUS)
                add_library(Opus::opus INTERFACE IMPORTED GLOBAL)
                target_link_libraries(Opus::opus INTERFACE PkgConfig::SYS_OPUS)
              endif()
            endif()
          endif()
          EOF
          cmake -B build -G Ninja \
            -DCMAKE_PROJECT_INCLUDE="${GITHUB_WORKSPACE}/bro/opus.cmake" \
            -DBRO_PROFILE=desktop \
            -DBRO_WITH_3D=OFF \
            -DBRO_WITH_PHYSICS=OFF \
            -DBRO_WITH_GAMEAI=OFF \
            -DBRO_WITH_FLORA=OFF \
            -DBRO_WITH_VISION=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build --parallel 4 --target bro-headless bro_pty_child

      - name: Tests
        env:
          BRO_HEADLESS: ${{ github.workspace }}/bro/build/bro-headless
        run: helmapps/scripts/run_tests.sh
